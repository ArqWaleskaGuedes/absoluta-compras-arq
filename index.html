<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b3a2d">
<title>Arquitetura | Compras · Absoluta</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-storage-compat.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--side:#3b3a2d;--side2:#4a4939;--sidet:#e8e2d4;--bg:#f2ede5;--card:#fbf9f5;--card2:#f6f2eb;--line:#e5ddcf;--line2:#d6ccba;--ink:#2d2b24;--mut:#8b8576;
--ol:#5b5b3f;--ol2:#6e6e50;--sage:#8f9873;--sand:#d8c6a6;--tan:#a98b66;--y:#5b5b3f;--y2:#ebe7da;
--red:#a8473a;--red2:#f5ddd6;--amb:#8a6326;--amb2:#f3e3c7;--blue:#55613b;--blue2:#e4e8d7;--pur:#7a5b3e;--pur2:#eadfcf;--grn:#3f6b35;--grn2:#dde8d2;--gry:#6d675a;--gry2:#ece6da;
--sh:0 1px 2px rgba(60,50,30,.04),0 6px 20px rgba(60,50,30,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Jost,system-ui,-apple-system,sans-serif;color:var(--ink);font-size:14.5px;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
a{color:var(--ol)}
::selection{background:var(--sand)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:260px;flex:none;background:linear-gradient(180deg,#3f3e30,#353428);color:var(--sidet);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:26px 18px 18px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:30px;color:#efe9dc}
.logo svg{width:62px;height:50px;fill:none;stroke:#c9b48f;stroke-width:1.6}
.logo b{font-weight:500;letter-spacing:.24em;font-size:20px}
.logo small{font-size:9px;letter-spacing:.42em;opacity:.75;margin-top:-4px}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nl{font-size:10px;text-transform:uppercase;letter-spacing:.18em;opacity:.5;margin:16px 14px 6px}
.ni{display:flex;align-items:center;gap:13px;border:0;background:transparent;color:var(--sidet);font:400 15.5px Jost,sans-serif;padding:11px 14px;border-radius:10px;cursor:pointer;text-align:left;width:100%}
.ni:hover{background:rgba(255,255,255,.06)}
.ni.on{background:rgba(232,226,212,.16);color:#fff}
.ni .ct{margin-left:auto;font-size:11px;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:999px}
.ni .ct.al{background:#b5654f;color:#fff}
.ni.add{opacity:.7;font-size:14px}
.sidef{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:10px}
.me{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--sidet);cursor:pointer;width:100%;padding:6px;border-radius:12px;font-family:inherit;text-align:left}
.me:hover{background:rgba(255,255,255,.06)}
.me b{display:block;font-weight:500;font-size:15px}
.me small{font-size:12px;opacity:.65}
.av{width:42px;height:42px;border-radius:50%;background:#a98b66;color:#fff;display:grid;place-items:center;font-weight:500;font-size:17px;flex:none}
.av.sm{width:30px;height:30px;font-size:13px}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{position:relative;padding:30px 36px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
 background:radial-gradient(ellipse at 85% -40%,#e3d6bf 0,rgba(227,214,191,0) 60%)}
.hdr h1{font-size:34px;font-weight:500;letter-spacing:-.01em;margin:0;line-height:1.1}
.hdr h1 span{font-weight:300;color:var(--ol2)}
.hdr p{margin:6px 0 0;color:#6b6557;font-size:16px}
.hdrr{display:flex;align-items:center;gap:12px}
.gsearch{display:flex;align-items:center;gap:10px;background:#fffdf9;border:1px solid var(--line);border-radius:12px;padding:0 14px;width:380px;max-width:40vw;box-shadow:var(--sh)}
.gsearch input{border:0;background:transparent;font:inherit;padding:12px 0;width:100%;outline:none;color:var(--ink)}
.gsearch svg{color:var(--mut)}
.conn{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:7px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:#b8b09f;display:inline-block}
.conn.ok i{background:#6f8f4e}.conn.local i{background:#c9a24a}
main{padding:18px 36px 70px;max-width:1500px;width:100%}
h1{font-size:28px;font-weight:500;margin:0;letter-spacing:-.01em}
h2{font-size:19px;font-weight:500;margin:0}
.mut{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--sh)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.ph a,.lnk{font-size:13.5px;color:#4e4a3e;text-decoration:none;cursor:pointer;background:none;border:0;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--sh);cursor:default}
.kpi .ic{width:72px;height:72px;border-radius:14px;background:#ece7dc;display:grid;place-items:center;color:#4e4a3e;flex:none}
.kpi .ic svg{width:34px;height:34px;stroke-width:1.4}
.kpi small{display:block;font-size:14.5px;color:#4e4a3e}
.kpi b{display:block;font-size:34px;font-weight:500;line-height:1.15;margin-top:4px}
.kpi.al{background:linear-gradient(135deg,#fbefe9,#f8e6de);border-color:#efd3c8}
.kpi.al .ic{background:#f3d5ca;color:#a8473a}
.kpi.al b{color:#a8473a}
.row2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:20px;margin-bottom:20px}
/* obra cards */
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.oc{position:relative;height:214px;border-radius:12px;overflow:hidden;cursor:pointer;background:#7d7a62;color:#fff;transition:.2s;border:0;font-family:inherit;text-align:left;padding:0}
.oc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(60,50,30,.18)}
.oc .ph0{position:absolute;inset:0;background-size:cover;background-position:center}
.oc .ph0.ph-none{background:linear-gradient(160deg,#c9b997 0%,#8f8a6c 55%,#5d5b45 100%)}
.ohero .ph0.ph-none svg{position:absolute;right:40%;bottom:-6px;width:170px;height:150px;stroke:rgba(255,255,255,.3);stroke-width:1.1;fill:none}
.oc .ph0.ph-none svg{position:absolute;right:14px;top:16px;width:120px;height:110px;stroke:rgba(255,255,255,.35);stroke-width:1.2;fill:none}
.oc .ov{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(180deg,rgba(40,38,28,0),rgba(40,38,28,.82) 45%)}
.oc .on{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:500}
.oc .on span{font-size:14px;font-weight:400}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin:10px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.oc .chipw{display:inline-block;font-size:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:3px 10px;border-radius:999px}
.oc .resp{font-size:11.5px;opacity:.8;margin-left:6px}
/* donut */
.donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.donut svg{width:190px;height:190px;flex:none}
.leg{flex:1;min-width:170px;display:flex;flex-direction:column;gap:15px}
.leg div{display:flex;align-items:center;gap:10px;font-size:14.5px}
.leg i{width:13px;height:13px;border-radius:3px;flex:none}
.leg b{margin-left:auto;font-weight:500}
.leg em{font-style:normal;color:var(--mut);font-size:13px;margin-left:4px}
/* tabs */
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tab{border:0;background:transparent;font:400 15px Jost,sans-serif;color:var(--ink);padding:9px 20px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab:hover{background:#efe9de}
.tab.on{background:#6b6a4c;color:#fff}
.tab .c{font-size:11.5px;background:rgba(0,0,0,.07);padding:1px 8px;border-radius:999px}
.tab.on .c{background:rgba(255,255,255,.2)}
.tab .c.al{background:var(--red2);color:var(--red)}
.tabs .sp{flex:1}
/* obra head */
.ohero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:20px;min-height:150px;display:flex;align-items:flex-end;color:#fff;box-shadow:var(--sh)}
.ohero .ph0{position:absolute;inset:0;background-size:cover;background-position:center}
.ohero .ph0.ph-none{background:linear-gradient(120deg,#c9b997,#8f8a6c 55%,#5d5b45)}
.ohero .ov{position:relative;width:100%;padding:26px 26px 20px;background:linear-gradient(180deg,rgba(40,38,28,0),rgba(40,38,28,.75));display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ohero h1{font-size:32px}
.ohero .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ohero .chipw{font-size:12.5px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:4px 12px;border-radius:999px}
.ohero .stt{display:flex;gap:22px}
.ohero .stt div{text-align:right}
.ohero .stt small{display:block;font-size:12px;opacity:.8}
.ohero .stt b{font-size:22px;font-weight:500}
/* toolbar & form bits */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{font:inherit;border:1px solid var(--line);background:#fffdf9;color:var(--ink);border-radius:10px;padding:10px 14px;min-width:0;outline:none}
.toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--sage)}
.toolbar input[type=search]{flex:1 1 240px}
.chk{display:flex;align-items:center;gap:7px;font-size:14px;color:#5c5749;cursor:pointer}
.chk input{accent-color:var(--ol)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fffdf9;border-radius:999px;padding:6px 14px;font:400 13px Jost,sans-serif;cursor:pointer;color:#5c5749}
.chip.on{background:#6b6a4c;color:#fff;border-color:#6b6a4c}
.chip em{font-style:normal;opacity:.6;margin-left:5px}
.hint{font-size:13px;color:var(--mut);margin:-2px 0 12px}
.hint b{color:#4e4a3e;font-weight:500}
.btn{font:500 14px Jost,sans-serif;border:1px solid var(--line2);background:#fffdf9;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:#f4efe6}
.btn.pri{background:#5f5e42;border-color:#5f5e42;color:#fff}
.btn.pri:hover{background:#4f4e36}
.btn.dark{background:#a98b66;border-color:#a98b66;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:#6b6557}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.wa{background:#e3eedb;border-color:#cddfc0;color:#3f6b35}
.btn:disabled{opacity:.5;cursor:default}
/* pills */
.pill{display:inline-block;font-size:13px;padding:4px 14px;border-radius:7px;white-space:nowrap;font-weight:400}
.p-gry,.p-plan{background:var(--gry2);color:var(--gry)}
.p-red,.p-late{background:var(--red2);color:var(--red)}
.p-amb,.p-soon{background:var(--amb2);color:var(--amb)}
.p-blue,.p-sol{background:var(--blue2);color:var(--blue)}
.p-pur,.p-pedido{background:var(--amb2);color:var(--amb)}
.p-grn,.p-entregue{background:var(--grn2);color:var(--grn)}
.tag{font-size:11px;background:#e9e2d3;color:#5b5440;padding:2px 8px;border-radius:6px;letter-spacing:.04em}
.num{font-size:12px;color:var(--tan);letter-spacing:.04em;display:flex;gap:6px;align-items:center;margin-bottom:3px;font-weight:500}
.t{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.m{font-size:13px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.empty{text-align:center;padding:40px 18px;color:var(--mut);background:var(--card);border:1px dashed var(--line2);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:500;margin-bottom:6px}
.empty .btn{margin-top:16px}
.note{margin-top:16px;padding:11px 14px;border-radius:11px;background:#ece8db;color:#4e4a3e;font-size:14px}
.banner{padding:0 36px}
.banner div{background:var(--amb2);color:var(--amb);border-radius:11px;padding:10px 14px;font-size:14px;margin-top:10px}
/* listas simples (início) */
.lrow{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#f6f1e8}
.lrow .main{flex:1;min-width:0}
.lrow .side2{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.lrow .side2 small{font-size:12px;color:var(--mut)}
.dt{flex:none;width:64px;text-align:center;border-radius:10px;padding:7px 4px;background:var(--gry2)}
.dt small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.dt b{font-size:17px;font-weight:500}
.dt.late{background:var(--red2)}.dt.late b{color:var(--red)}
.dt.soon{background:var(--amb2)}.dt.soon b{color:var(--amb)}
/* planilha */
.tw{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);max-height:calc(100vh - 330px);min-height:240px;box-shadow:var(--sh)}
table.st{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px}
.st th{position:sticky;top:0;z-index:2;background:var(--card);font-size:13.5px;font-weight:500;color:#3e3b31;text-align:left;padding:13px 12px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.st td{border-bottom:1px solid var(--line);padding:0;height:48px;vertical-align:middle}
.st tr:hover td{background:#f6f1e8}
.st th:first-child,.st td:first-child{position:sticky;left:0;z-index:1;background:var(--card)}
.st th:first-child{z-index:3}
.st tr:hover td:first-child{background:#f6f1e8}
.cell{width:100%;height:48px;background:transparent;border:0;color:var(--ink);font:inherit;font-size:14.5px;padding:0 12px;outline:none;border-radius:0;min-width:0}
select.cell{-webkit-appearance:none;appearance:none;cursor:pointer;padding-right:4px}
input.cell[type=date]{font-size:13.5px}
.cell:hover{background:rgba(169,139,102,.07)}
.cell:focus{background:#fffdf9;box-shadow:inset 0 0 0 2px var(--sage)}
.cell::placeholder{color:#c3baa8}
.cell.it{font-weight:500;min-width:230px}
.cell.n{text-align:right}
.calc{padding:0 12px !important;white-space:nowrap;font-size:14.5px}
.calc.late{color:var(--red);font-weight:500}.calc.soon{color:var(--amb);font-weight:500}
.act{padding:0 8px !important;white-space:nowrap;text-align:right}
.ib{border:1px solid transparent;background:transparent;color:#5c5749;width:32px;height:32px;border-radius:8px;cursor:pointer;font:500 16px Jost,sans-serif;display:inline-grid;place-items:center;text-decoration:none;vertical-align:middle}
.ib:hover{background:#eee7da}
.ib.y{color:#fff;background:#6b6a4c}
.ib.y:hover{background:#5b5a3f}
.mrow td{background:var(--card2) !important;height:auto !important;padding:9px 12px !important;font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--tan)}
.mrow td span{color:var(--mut);margin-left:8px}
.addrow td{height:52px;background:#faf6ef !important}
.addrow input{width:100%;height:52px;background:transparent;border:0;color:var(--ink);font:400 14.5px Jost,sans-serif;padding:0 14px;outline:none}
.addrow input::placeholder{color:var(--ol2)}
.addrow input:focus{box-shadow:inset 0 0 0 2px var(--sage);background:#fffdf9}
.pl{cursor:pointer}
/* quadro */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 1 0;min-width:176px;background:#ece6db;border:1px solid transparent;border-radius:16px;padding:12px;min-height:280px;scroll-snap-align:start;transition:.12s}
.col.over{border-color:var(--sage);background:#e4e3d2}
.colh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 4px 12px}
.colh b{font-size:15px;font-weight:500}
.colh em{font-style:normal;font-size:12px;color:var(--mut);margin-left:6px}
.colh .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:9px}
.colx{display:flex;gap:6px;margin-bottom:10px}
.colx .btn{flex:1;justify-content:center}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;cursor:grab;transition:.12s;user-select:none;box-shadow:0 1px 2px rgba(60,50,30,.05)}
.kc:hover{box-shadow:0 6px 16px rgba(60,50,30,.1)}
.kc.dragging{opacity:.35}
.kf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px}
.kf .v{font-weight:500;font-size:14px}
.kf .bt{display:flex;gap:4px;align-items:center}
.sent{font-size:12px;color:var(--grn);margin-top:6px}
.kempty{font-size:13px;color:#a69f8e;text-align:center;padding:26px 6px;border:1px dashed var(--line2);border-radius:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(45,40,28,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(40,32,18,.3)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.mt{font-weight:500;font-size:21px}
.ms{font-size:13.5px;color:var(--mut);margin-top:3px}
.x{border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:#6b6557;flex:none}
.mb{padding:18px 24px 22px;overflow:auto;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line);background:var(--card2)}
.mf .btn:first-child.ghost{margin-right:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld span{font-size:13px;color:#5c5749}
.fld small{font-size:12px;color:var(--mut)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fffdf9;color:var(--ink);width:100%;min-width:0;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(143,152,115,.2)}
.fld textarea{resize:vertical}
.w2,.sec{grid-column:1/-1}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--tan);margin-top:14px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:0}
.flow{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto}

const catKey=c=>String(c||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').toLowerCase();
function verbaOf(obraId,cat,exceptSol){
  const o=obraById(obraId)||{};const lim=Number((o.verbas||{})[catKey(cat)])||0;

}

const STAGES=[['pedir','A pedir','#e2d8c6'],['solicitado','Solicitado','#c9b48f'],['cotacao','Em cotação','#97a07a'],['aprovado','Aprovado','#6f7a52'],['pedido','Pedido feito','#a98b66'],['entregue','Entregue','#4f5638']];
const STC=Object.fromEntries(STAGES.map(([k,,c])=>[k,c]));
function stageOf(c){const s=solOf(c.id);if(!s)return 'pedir';const r=reqOf(s.id);if(r)return r.status==='entregue'?'entregue':'pedido';return {nova:'solicitado',contato:'cotacao',cotada:'cotacao',aprovada:'aprovado',requisitada:'pedido'}[s.status]||'solicitado'}
function flowChart(obraId){

function cronTimeline(){
  const id=UI.obra;
  const arr=S.cronograma.filter(c=>c.obra===id&&matchQ(c,['item','local','categoria','obs'])&&(!UI.cat||c.categoria===UI.cat)&&(!UI.pend||!solOf(c.id))&&(!UI.stage||stageOf(c)===UI.stage));
  if(!arr.length)return `<div class="empty"><b>${UI.q||UI.cat||UI.pend||UI.stage?'Nada com esses filtros':'Cronograma vazio'}</b>${UI.q||UI.cat||UI.pend||UI.stage?'':'Lance os itens pela <b>Planilha</b> (dá para colar do Excel) ou pelo botão Novo item.'}${canWrite&&!UI.stage?'<br><button class="btn pri" data-cview="planilha">Abrir planilha</button>':''}</div>`;
  const dated=arr.filter(c=>c.dataNecessaria),undated=arr.filter(c=>!c.dataNecessaria);
  let html='';
  if(dated.length){
    const T=today();
    const ds=dated.flatMap(c=>[parseD(limite(c)),parseD(c.dataNecessaria)]).concat([T]);
    let st=new Date(Math.min(...ds));st=new Date(st.getFullYear(),st.getMonth(),1);
    let en=new Date(Math.max(...ds));en=new Date(en.getFullYear(),en.getMonth()+1,0);
    const days=Math.round((en-st)/864e5)+1;
    const PX=Math.max(4,Math.min(14,Math.round(900/days)));
    const W=days*PX,x=d=>Math.round((d-st)/864e5)*PX;
    let months='',cur=new Date(st);
    while(cur<=en){const nx=new Date(cur.getFullYear(),cur.getMonth()+1,1);const w=x(nx>en?new Date(en.getTime()+864e5):nx)-x(cur);
      months+=`<div class="tm" style="left:${x(cur)}px;width:${w}px">${MESES[cur.getMonth()].slice(0,3)}${cur.getMonth()===0||cur.getTime()===st.getTime()?' '+String(cur.getFullYear()).slice(2):''}</div>`;cur=nx}
    const groups={};dated.forEach(c=>{const g=c.categoria||'Sem categoria';(groups[g]=groups[g]||[]).push(c)});
    const gk=Object.keys(groups).sort((a,b)=>(a==='Sem categoria')-(b==='Sem categoria')||a.localeCompare(b));
    let rows='';
    gk.forEach(g=>{
      rows+=`<div class="tg"><div class="tl">${esc(g)} <span>${groups[g].length}</span></div><div class="tr" style="width:${W}px"></div></div>`;
      groups[g].sort((a,b)=>limite(a).localeCompare(limite(b))).forEach(c=>{
        const L=parseD(limite(c)),N=parseD(c.dataNecessaria),k=stageOf(c),cs=cronStatus(c);
        const l=x(L),w=Math.max(x(N)-l,PX*2);
        const tip=`${c.item} — pedir até ${fmtDY(limite(c))} · em obra ${fmtDY(c.dataNecessaria)} · ${STAGES.find(s=>s[0]===k)[1]}`;
        rows+=`<div class="trow"><div class="tl" data-cron="${esc(c.id)}"><b>${esc(c.item)}</b><small>${esc(join([qtdTxt(c),c.local]))}</small></div>
          <div class="tr" style="width:${W}px"><div class="bar2 ${k==='pedir'?cs.k:''}" data-cron="${esc(c.id)}" title="${esc(tip)}" style="left:${l}px;width:${w}px;--c:${STC[k]}"><span>${w>90?esc(fmtD(limite(c))+' → '+fmtD(c.dataNecessaria)):''}</span></div><i class="dia" style="left:${l+w-6}px;--c:${STC[k]}" title="Em obra ${fmtDY(c.dataNecessaria)}"></i></div></div>`;
      });
    });

async function cellChange(el){

async function addCron(text){
  const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
  if(!lines.length)return;
  const base=Date.now();
  for(let i=0;i<lines.length;i++){
    const p=lines[i].split('\t').map(x=>x.trim());
    const un=p[2]&&UNS.find(u=>u.toLowerCase()===p[2].toLowerCase().replace('m2','m²'));
    const o={id:uid(),obra:UI.obra,item:p[0],criadoEm:new Date(base+i).toISOString(),categoria:UI.cat||'',un:un||'un'};
    if(p[1])o.qtd=parseNum(p[1]);
    if(p[3])o.local=p[3];
    if(p[4])o.dataNecessaria=parseDateBR(p[4]);
    if(p[5])o.leadDias=parseNum(p[5]);
    if(!o.item)continue;
    try{await put('cronograma',o)}catch(e){return}
  }
  if(lines.length>1)toast(`${lines.length} itens adicionados`);
}

async function moveSol(id,to){

  }

function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const W=900,sc=Math.min(1,W/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>180000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};img.onerror=rej;img.src=url})}

/* ---------- solicitação ---------- */
function specLines(s){
  return [s.modelo||s.marca?'Modelo/referência: '+join([s.modelo,s.marca],' · '):'',s.acabamento?'Cor e características: '+s.acabamento:'',s.dimensoes?'Medidas: '+s.dimensoes:'',s.referencia?'Projeto: '+s.referencia:'',(s.anexos||[]).length?'Anexos: '+s.anexos.map(a=>a.nome).join(', '):'',s.especificacao?'Outras informações: '+s.especificacao:''].filter(Boolean);
}
function quoteMsg(s){
  const L=[`Olá${s.contato?', '+s.contato:''}! Tudo bem?`,`Aqui é da Absoluta Construtora. Gostaríamos de um orçamento para a obra ${obraNome(s.obra)}:`,'',`• Produto: ${s.item||''}`];
  if(qtdTxt(s))L.push(`• Quantidade: ${qtdTxt(s)}`);
  if(s.modelo||s.marca)L.push(`• Modelo / referência: ${join([s.modelo,s.marca],' · ')}`);
  if(s.acabamento)L.push(`• Cor e características: ${s.acabamento}`);
  if(s.dimensoes)L.push(`• Medidas: ${s.dimensoes}`);
  if(s.referencia)L.push(`• Projeto / desenho: ${s.referencia}`);
  (s.anexos||[]).forEach(a=>L.push(`• Projeto / desenho: ${a.url}`));
  if(s.especificacao)L.push(`• Observações: ${s.especificacao}`);
  L.push('');
  if(s.dataNecessaria)L.push(`Precisamos do material na obra até ${fmtDY(s.dataNecessaria)}.`);
  L.push('Pode nos enviar valor, prazo de entrega e condições de pagamento?','','Obrigado(a)!');
  return L.join('\n');
}
function waHref(s){
  const d=String(s.telefone||'').replace(/\D/g,'');if(d.length<10)return '';
  const n=d.startsWith('55')&&d.length>=12?d:'55'+d;
  return `https://wa.me/${n}?text=${encodeURIComponent(quoteMsg(s))}`;
}

/* ---------- copiar / toast ---------- */
let tt;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2800)}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast('Copiado!')}
  catch(e){
    const d=document.createElement('div');d.className='copybox';
    d.innerHTML=`<div class="sheet"><div class="mt">Copie o texto abaixo</div><textarea readonly></textarea><div style="text-align:right"><button class="btn pri">Fechar</button></div></div>`;
    d.querySelector('textarea').value=text;document.body.appendChild(d);
    const ta=d.querySelector('textarea');ta.focus();ta.select();
    d.querySelector('button').onclick=()=>d.remove();
  }
}

  if('newobra' in d)return openObra();
  if('editobra' in d)return openObra(obraById(UI.obra));
  if(d.obra){UI.obra=d.obra;UI.q='';UI.gq='';if($('#gq'))$('#gq').value='';saveUI();render();window.scrollTo(0,0);return}
  if(d.view){UI.view=d.view;UI.q='';saveUI();render();return}
  if('allcats' in d){UI.allcats=!UI.allcats;render();return}
  if(d.stage){UI.stage=UI.stage===d.stage?'':d.stage;render();return}
  if(d.cview){UI.cview=d.cview;saveUI();render();return}
  if(d.chip){const[k,v]=d.chip.split(':');UI[k]=v;saveUI();render();return}
  if('mailbatch' in d)return mailBatch();
  if(d.mailsol)return mailSol(byId('solicitacoes',d.mailsol));
  if(d.mailreq)return mailReq(byId('requisicoes',d.mailreq));
  if(d.adv){const s=byId('solicitacoes',d.adv);if(s)moveSol(s.id,SOL_FLOW[SOL_FLOW.indexOf(s.status)+1]);return}
  if('newsol' in d)return openSol();
  if(d.solfrom)return openSol(null,byId('cronograma',d.solfrom));
  if(d.opensol)return openSol(byId('solicitacoes',d.opensol));
  if(d.cron)return openCron(byId('cronograma',d.cron));
  if(d.sol)return openSol(byId('solicitacoes',d.sol));
  if(d.req)return openReq(byId('requisicoes',d.req));
  if(d.go){const[o,v,k,id]=d.go.split('|');UI.obra=o;UI.view=v;UI.q='';saveUI();render();
    UI.gq='';const gs=$('#gq');if(gs)gs.value='';render();if(k==='cron')openCron(byId('cronograma',id));else if(k==='req')openReq(byId('requisicoes',id));else openSol(byId('solicitacoes',id));}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;renderItems()}if(e.target.id==='gq'){UI.gq=e.target.value.trim();render()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cat'){UI.cat=t.value;renderItems()}
  else if(t.id==='pend'){UI.pend=t.checked;renderItems()}
  else if(t.id==='cancel'){UI.cancel=t.checked;saveUI();renderItems()}
  else if(t.dataset&&t.dataset.verba!=null){const o=obraById(UI.obra);if(o){const v=t.value.trim()===''?null:parseMoney(t.value);const vb=Object.assign({},o.verbas||{});if(v==null)delete vb[t.dataset.verba];else vb[t.dataset.verba]=v;put('obras',Object.assign({},o,{verbas:vb})).then(()=>render())}}
  else if(t.classList.contains('cell')&&t.closest('#items'))cellChange(t);
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')){closeModal();return}
  if(t.id==='addcron'&&e.key==='Enter'){e.preventDefault();const v=t.value;t.value='';addCron(v);return}
  if(t.classList&&t.classList.contains('cell')&&t.closest('#items')&&e.key==='Enter'&&t.tagName==='INPUT'){
    e.preventDefault();
    const tr=t.closest('tr'),idx=[...tr.querySelectorAll('.cell')].indexOf(t);
    let nx=tr.nextElementSibling;while(nx&&!nx.dataset.row&&!nx.classList.contains('addrow'))nx=nx.nextElementSibling;
    t.blur();
    if(nx){const target=nx.classList.contains('addrow')?nx.querySelector('input'):nx.querySelectorAll('.cell')[idx];if(target)setTimeout(()=>target.focus(),0)}
  }
});
document.addEventListener('paste',e=>{
  if(e.target.id!=='addcron')return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');
  if(txt&&/\n|\t/.test(txt.trim())){e.preventDefault();addCron(txt)}
});
/* arrastar cartões */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.kc');if(!c)return;dragId=c.dataset.sol;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',e=>{document.querySelectorAll('.kc.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>{if(x!==col)x.classList.remove('over')});col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();col.classList.remove('over');const id=dragId;dragId=null;moveSol(id,col.dataset.col)});

init();
</script>
</body>
</html>
